name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run lint
      - run: npm test
      - run: npm run doctor
      - run: npm run validate:repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm pack --dry-run
